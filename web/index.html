<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bocado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Bocado</h1>
    <p>Poné lo que tenés en casa y mirá qué podés cocinar.</p>
  </header>

  <main>
    <section class="panel">
      <label for="pantry">Ingredientes que tenés (separados por coma)</label>
      <input id="pantry" type="text" placeholder="papa, huevo, cebolla" autocomplete="off">
      <div class="row">
        <label>Dieta
          <select id="diet">
            <option value="">Cualquiera</option>
            <option value="vegetariano">Vegetariana</option>
            <option value="vegano">Vegana</option>
            <option value="sin-tacc">Sin TACC</option>
          </select>
        </label>
        <label>Evitar
          <input id="exclude" type="text" placeholder="ej: huevo">
        </label>
        <label>Tiempo máx. (min)
          <input id="minutes" type="number" min="5" step="5" placeholder="sin límite">
        </label>
      </div>
    </section>

    <section>
      <h2>Podés cocinar</h2>
      <div id="suggestions"></div>
    </section>

    <section>
      <h2>Plan de la semana</h2>
      <button id="plan-btn" type="button">Armar plan de 5 comidas</button>
      <ol id="plan"></ol>
      <h3>Lista de compras</h3>
      <pre id="shopping" aria-live="polite"></pre>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
