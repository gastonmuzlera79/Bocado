name: Publicar en GitHub Pages

# Publica la versión estática de la web (sin servidor, con el recetario de prueba)
# en https://<usuario>.github.io/<repositorio>/ cada vez que se actualiza main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias de la web
        run: npm ci
        working-directory: web
      - name: Armar el sitio estático
        # El prefijo es el nombre del repositorio, que es la subcarpeta donde Pages publica el sitio.
        run: node tools/sitio_estatico.mjs "/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  publicar:
    needs: armar
    runs-on: ubuntu-latest
    # Solo este job necesita permisos para desplegar en Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
