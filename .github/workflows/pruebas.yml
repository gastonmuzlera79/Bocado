name: Pruebas

on:
  push:
  pull_request:

jobs:
  base-de-datos:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones, pruebas de permisos y datos
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: tools/probar_db.sh

  recetario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar recetario
        run: python3 tools/validar_recetario.py data/recetas
